<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where to Hoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --page-bg: #f6f7f4;
            --surface: #ffffff;
            --surface-muted: #f0f3ef;
            --border: #dfe4dc;
            --text: #1e241f;
            --muted: #6b746b;
            --available-high: #1f8f4d;
            --available-medium: #d99a18;
            --available-low: #d8662f;
            --available-none: #c74747;
            --accent: #2b6f6d;
            --accent-soft: #dcecea;
            --shadow: 0 8px 24px rgba(31, 36, 32, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--page-bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .app-shell {
            width: min(1440px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: var(--text);
            color: white;
            flex: 0 0 auto;
        }

        .brand-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 750;
            letter-spacing: 0;
        }

        .brand-subtitle {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .updated-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: var(--muted);
            font-size: 0.88rem;
            white-space: nowrap;
        }

        .status-strip {
            display: grid;
            grid-template-columns: minmax(220px, 0.9fr) repeat(2, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .time-panel {
            padding: 18px;
        }

        .current-time {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.75rem;
            font-weight: 780;
            line-height: 1.1;
        }

        .current-date {
            margin-top: 8px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .live-indicator {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--available-high);
            box-shadow: 0 0 0 5px rgba(31, 143, 77, 0.12);
            flex: 0 0 auto;
        }

        .stats-card {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 14px;
            min-height: 136px;
            padding: 18px;
        }

        .stats-number {
            min-width: 56px;
            color: var(--accent);
            font-size: 2.4rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .stats-label {
            margin-bottom: 8px;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .venue-list {
            display: grid;
            gap: 6px;
            font-size: 0.86rem;
        }

        .venue-list-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 6px;
            background: var(--surface-muted);
        }

        .venue-list-item span:first-child {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .venue-list-more {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: minmax(220px, 320px) 1fr auto;
            align-items: end;
            gap: 18px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .control-label {
            display: block;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .date-selector {
            min-height: 42px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            background-color: var(--surface);
            font-size: 0.95rem;
        }

        .filter-group {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-muted);
        }

        .filter-btn {
            min-height: 34px;
            border: 0;
            border-radius: 6px;
            padding: 0 12px;
            color: var(--muted);
            background: transparent;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .filter-btn.active {
            color: var(--text);
            background: var(--surface);
            box-shadow: 0 2px 8px rgba(31, 36, 32, 0.08);
        }

        .legend {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 9px;
            height: 9px;
            border-radius: 999px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 16px;
            margin: 8px 0 10px;
        }

        .section-heading h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
        }

        .section-heading small {
            color: var(--muted);
        }

        .venues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 12px;
        }

        .venue-card {
            display: flex;
            flex-direction: column;
            min-height: 360px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .venue-card-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 12px;
            padding: 14px 14px 12px;
            border-bottom: 1px solid var(--border);
        }

        .venue-name {
            min-width: 0;
            margin: 0;
            font-size: 1rem;
            font-weight: 800;
            line-height: 1.25;
        }

        .venue-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .availability-summary {
            padding: 5px 8px;
            border-radius: 6px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .venue-card-body {
            display: grid;
            gap: 6px;
            max-height: 390px;
            overflow-y: auto;
            padding: 10px;
        }

        .time-slot {
            display: grid;
            grid-template-columns: minmax(86px, auto) 1fr auto;
            align-items: center;
            gap: 10px;
            min-height: 38px;
            padding: 7px 8px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: var(--surface-muted);
        }

        .time-slot.current-slot {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .time-slot-time {
            font-weight: 760;
            font-variant-numeric: tabular-nums;
        }

        .slot-track {
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: #d8ded5;
        }

        .slot-fill {
            height: 100%;
            border-radius: inherit;
            background: var(--available-none);
        }

        .availability-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-width: 58px;
            min-height: 26px;
            border-radius: 6px;
            padding: 0 8px;
            color: white;
            font-size: 0.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .availability-high { background: var(--available-high); }
        .availability-medium { background: var(--available-medium); color: #231b08; }
        .availability-low { background: var(--available-low); }
        .availability-none { background: var(--available-none); }

        .no-data {
            grid-column: 1 / -1;
            padding: 44px 16px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--muted);
            text-align: center;
        }

        .muted-empty {
            padding: 28px 8px;
            color: var(--muted);
            text-align: center;
            font-size: 0.9rem;
        }

        .page-footer {
            padding: 22px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 0.82rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.18s ease-out;
        }

        @media (max-width: 980px) {
            .status-strip {
                grid-template-columns: 1fr;
            }

            .controls-panel {
                grid-template-columns: 1fr;
                align-items: stretch;
            }

            .legend {
                justify-content: flex-start;
            }
        }

        @media (max-width: 560px) {
            .app-shell {
                width: min(100% - 20px, 1440px);
                padding-top: 14px;
            }

            .top-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .updated-pill {
                width: 100%;
                white-space: normal;
            }

            .stats-card {
                grid-template-columns: 1fr;
                min-height: 0;
            }

            .filter-group {
                display: grid;
                grid-template-columns: 1fr;
            }

            .venues-grid {
                grid-template-columns: 1fr;
            }

            .venue-card {
                min-height: 0;
            }

            .time-slot {
                grid-template-columns: minmax(72px, auto) 1fr auto;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell">
        <header class="top-bar">
            <div class="brand-block">
                <div class="brand-mark" aria-hidden="true">
                    <i class="bi bi-dribbble"></i>
                </div>
                <div>
                    <h1 class="brand-title">Where to Hoop</h1>
                    <div class="brand-subtitle">Melbourne court availability</div>
                </div>
            </div>
            <div class="updated-pill">
                <i class="bi bi-clock-history"></i>
                <span id="lastUpdated">Loading availability...</span>
            </div>
        </header>

        <section class="status-strip" aria-label="Current availability">
            <div class="panel time-panel">
                <div class="current-time">
                    <span class="live-indicator" aria-hidden="true"></span>
                    <span id="currentTime">--:--:--</span>
                </div>
                <div class="current-date" id="currentDateDisplay">Loading...</div>
            </div>

            <div class="panel stats-card">
                <div class="stats-number" id="statNowAvailable">-</div>
                <div>
                    <div class="stats-label">Available right now</div>
                    <div class="venue-list" id="venuesNowList"></div>
                </div>
            </div>

            <div class="panel stats-card">
                <div class="stats-number" id="statNext2Hours">-</div>
                <div>
                    <div class="stats-label">Available in next 2 hours</div>
                    <div class="venue-list" id="venuesNext2HoursList"></div>
                </div>
            </div>
        </section>

        <section class="panel controls-panel" aria-label="Filters">
            <div>
                <label class="control-label" for="dateSelector">Date</label>
                <select class="form-select date-selector" id="dateSelector" onchange="changeDate()"></select>
            </div>

            <div>
                <span class="control-label">Filter</span>
                <div class="filter-group" role="group" aria-label="Availability filter">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')" type="button" aria-pressed="true">All slots</button>
                    <button class="filter-btn" data-filter="available" onclick="setFilter('available')" type="button" aria-pressed="false">Available</button>
                    <button class="filter-btn" data-filter="good" onclick="setFilter('good')" type="button" aria-pressed="false">3+ courts</button>
                </div>
            </div>

            <div class="legend" aria-label="Legend">
                <div class="legend-item">
                    <span class="legend-color" style="background: var(--available-high);"></span>
                    <span>Good</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: var(--available-medium);"></span>
                    <span>Limited</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: var(--available-low);"></span>
                    <span>Low</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: var(--available-none);"></span>
                    <span>Full</span>
                </div>
            </div>
        </section>

        <div class="section-heading">
            <h2>Venues</h2>
            <small id="venueCount">Loading venues...</small>
        </div>

        <section class="venues-grid" id="venuesGrid" aria-live="polite"></section>

        <footer class="page-footer">
            Data refreshes from the saved scraper output.
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allData = {};
        let currentDate = null;
        let currentFilter = 'all';

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-AU', {
                timeZone: 'Australia/Melbourne',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
            const dateStr = now.toLocaleDateString('en-AU', {
                timeZone: 'Australia/Melbourne',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById('currentTime').textContent = timeStr;
            document.getElementById('currentDateDisplay').textContent = dateStr;
        }

        setInterval(updateClock, 1000);
        updateClock();

        setInterval(() => {
            loadData();
        }, 120000);

        function timeToMinutes(time24h) {
            const [hours, minutes] = time24h.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        function getSlotInterval(slots) {
            if (slots.length < 2) return 60;
            const time1 = timeToMinutes(slots[0].time_24h);
            const time2 = timeToMinutes(slots[1].time_24h);
            return Math.max(time2 - time1, 15);
        }

        function isCurrentSlot(time24h, slots) {
            const now = getCurrentMinutes();
            const slotStart = timeToMinutes(time24h);
            const slotEnd = slotStart + getSlotInterval(slots);
            return now >= slotStart && now < slotEnd;
        }

        function isWithinNextHours(time24h, hours, slots) {
            const now = getCurrentMinutes();
            const slotStart = timeToMinutes(time24h);
            const slotEnd = slotStart + getSlotInterval(slots);
            const futureLimit = now + (hours * 60);
            return slotEnd > now && slotStart < futureLimit;
        }

        async function loadData() {
            try {
                const response = await fetch('/api/data');
                allData = await response.json();

                populateDateSelector();

                if (allData.last_updated) {
                    const lastUpdatedDate = new Date(allData.last_updated);
                    document.getElementById('lastUpdated').textContent =
                        `Updated ${lastUpdatedDate.toLocaleString('en-AU', {
                            timeZone: 'Australia/Melbourne',
                            dateStyle: 'medium',
                            timeStyle: 'short'
                        })}`;
                }

                renderAll();
            } catch (error) {
                document.getElementById('venuesGrid').innerHTML = `
                    <div class="no-data">
                        <i class="bi bi-exclamation-triangle"></i> Error loading data. Run the scraper first.
                    </div>
                `;
                document.getElementById('venueCount').textContent = 'No data loaded';
            }
        }

        function populateDateSelector() {
            const dateSelector = document.getElementById('dateSelector');
            const previousDate = currentDate;
            dateSelector.innerHTML = '';

            const allDates = new Set();
            Object.values(allData.venues || {}).forEach(venue => {
                Object.keys(venue.days || {}).forEach(date => allDates.add(date));
            });

            const dates = Array.from(allDates).sort();
            const today = new Date().toISOString().split('T')[0];

            dates.forEach(date => {
                const option = document.createElement('option');
                option.value = date;
                option.textContent = formatDate(date) + (date === today ? ' (today)' : '');
                dateSelector.appendChild(option);
            });

            if (previousDate && dates.includes(previousDate)) {
                currentDate = previousDate;
            } else if (dates.includes(today)) {
                currentDate = today;
            } else {
                currentDate = dates[0] || null;
            }

            if (currentDate) {
                dateSelector.value = currentDate;
            }
        }

        function formatDate(dateStr) {
            const date = new Date(`${dateStr}T12:00:00`);
            return date.toLocaleDateString('en-AU', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }

        function changeDate() {
            currentDate = document.getElementById('dateSelector').value;
            renderAll();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = btn.dataset.filter === filter;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', String(isActive));
            });
            renderAll();
        }

        function filterSlots(slots) {
            switch (currentFilter) {
                case 'available':
                    return slots.filter(slot => slot.available > 0);
                case 'good':
                    return slots.filter(slot => slot.available >= 3);
                default:
                    return slots;
            }
        }

        function getAvailabilityClass(available) {
            if (available === 0) return 'availability-none';
            if (available === 1) return 'availability-low';
            if (available === 2) return 'availability-medium';
            return 'availability-high';
        }

        function getAvailabilityText(available, max) {
            if (available === 0) return 'Full';
            return `${available}/${max}`;
        }

        function getAvailabilityPercent(slot) {
            if (!slot.max_slots) return 0;
            return Math.max(0, Math.min(100, Math.round((slot.available / slot.max_slots) * 100)));
        }

        function getBestSlot(slots) {
            if (!slots.length) return null;
            return slots.reduce((best, slot) => slot.available > best.available ? slot : best, slots[0]);
        }

        function updateRealTimeStats() {
            const today = new Date().toISOString().split('T')[0];
            const venues = allData.venues || {};
            const venuesNow = [];
            const venuesNext2Hours = [];

            Object.values(venues).forEach(venue => {
                const slots = venue.days?.[today] || [];
                const currentSlot = slots.find(slot => isCurrentSlot(slot.time_24h, slots) && slot.available > 0);

                if (currentSlot) {
                    venuesNow.push({
                        name: venue.name,
                        available: currentSlot.available,
                        max: currentSlot.max_slots,
                        time: currentSlot.time_slot
                    });
                }

                const next2HourSlots = slots.filter(slot => isWithinNextHours(slot.time_24h, 2, slots) && slot.available > 0);
                if (next2HourSlots.length > 0) {
                    const bestSlot = getBestSlot(next2HourSlots);
                    venuesNext2Hours.push({
                        name: venue.name,
                        available: bestSlot.available,
                        max: bestSlot.max_slots,
                        time: bestSlot.time_slot,
                        slotsCount: next2HourSlots.length
                    });
                }
            });

            document.getElementById('statNowAvailable').textContent = venuesNow.length;
            renderCompactVenueList('venuesNowList', venuesNow, 'No venues available right now');

            document.getElementById('statNext2Hours').textContent = venuesNext2Hours.length;
            renderCompactVenueList('venuesNext2HoursList', venuesNext2Hours, 'No venues available in next 2 hours');
        }

        function renderCompactVenueList(elementId, venues, emptyText) {
            const list = document.getElementById(elementId);
            if (venues.length === 0) {
                list.innerHTML = `<div class="muted-empty">${emptyText}</div>`;
                return;
            }

            const visibleVenues = venues.slice(0, 4);
            const hiddenCount = venues.length - visibleVenues.length;

            list.innerHTML = visibleVenues.map(venue => `
                <div class="venue-list-item">
                    <span>${venue.name}</span>
                    <span class="availability-badge ${getAvailabilityClass(venue.available)}">${venue.available}/${venue.max}</span>
                </div>
            `).join('') + (hiddenCount > 0 ? `<div class="venue-list-more">+${hiddenCount} more venues</div>` : '');
        }

        function renderVenuesGrid() {
            const grid = document.getElementById('venuesGrid');
            const venues = allData.venues || {};
            const venueEntries = Object.entries(venues);

            document.getElementById('venueCount').textContent = `${venueEntries.length} venues`;

            if (venueEntries.length === 0) {
                grid.innerHTML = '<div class="no-data">No venue data available. Run the scraper first.</div>';
                return;
            }

            grid.innerHTML = '';

            venueEntries.forEach(([venueId, venue]) => {
                const slots = venue.days?.[currentDate] || [];
                const filteredSlots = filterSlots(slots);
                const availableCount = slots.filter(slot => slot.available > 0).length;
                const totalCount = slots.length;
                const bestSlot = getBestSlot(slots);

                const card = document.createElement('article');
                card.className = 'venue-card animate-in';

                const slotsHtml = filteredSlots.length > 0
                    ? filteredSlots.map(slot => {
                        const isCurrent = isCurrentSlot(slot.time_24h, slots);
                        const fillWidth = getAvailabilityPercent(slot);
                        return `
                            <div class="time-slot ${isCurrent ? 'current-slot' : ''}">
                                <span class="time-slot-time">${slot.time_slot}</span>
                                <span class="slot-track" aria-hidden="true">
                                    <span class="slot-fill ${getAvailabilityClass(slot.available)}" style="width: ${fillWidth}%;"></span>
                                </span>
                                <span class="availability-badge ${getAvailabilityClass(slot.available)}">
                                    ${getAvailabilityText(slot.available, slot.max_slots)}
                                </span>
                            </div>
                        `;
                    }).join('')
                    : '<div class="muted-empty">No slots match this filter</div>';

                card.innerHTML = `
                    <header class="venue-card-header">
                        <div>
                            <h3 class="venue-name">${venue.name}</h3>
                            <div class="venue-meta">
                                ${totalCount} slots${bestSlot ? ` · best ${bestSlot.available}/${bestSlot.max_slots} at ${bestSlot.time_slot}` : ''}
                            </div>
                        </div>
                        <div class="availability-summary">${availableCount}/${totalCount}</div>
                    </header>
                    <div class="venue-card-body">
                        ${slotsHtml}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function renderAll() {
            updateRealTimeStats();
            renderVenuesGrid();
        }

        setInterval(updateRealTimeStats, 60000);
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
